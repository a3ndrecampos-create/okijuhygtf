name: Gerar Keystore (rodar uma vez só)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gerar chave de envio
        env:
          JA_EXISTE: ${{ secrets.ARKA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$JA_EXISTE" ]; then
            echo "::error::Já existe uma chave cadastrada (ARKA_KEYSTORE_BASE64). Não gere outra: a Play Store só aceita atualizações assinadas com a mesma chave."
            exit 1
          fi
          mkdir -p saida
          SENHA=$(openssl rand -base64 36 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -keystore saida/arka-upload.jks -storetype PKCS12 \
            -alias arka -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$SENHA" -keypass "$SENHA" \
            -dname "CN=Arka, OU=Arka, O=Arka, L=Sao Paulo, ST=SP, C=BR"
          {
            echo "Cadastre estes 4 segredos em: repositório > Settings > Secrets and variables > Actions > New repository secret"
            echo ""
            echo "ARKA_KEYSTORE_PASSWORD=$SENHA"
            echo "ARKA_KEY_PASSWORD=$SENHA"
            echo "ARKA_KEY_ALIAS=arka"
            echo "ARKA_KEYSTORE_BASE64 (o texto longo abaixo, sem quebras de linha):"
            base64 -w0 saida/arka-upload.jks
            echo ""
          } > saida/SEGREDOS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: arka-keystore
          path: saida/*
          retention-days: 2
