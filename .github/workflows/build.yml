name: Build APK e AAB

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARKA_KEYSTORE_B64: ${{ secrets.ARKA_KEYSTORE_BASE64 }}
      ARKA_KEYSTORE_PASSWORD: ${{ secrets.ARKA_KEYSTORE_PASSWORD }}
      ARKA_KEY_ALIAS: ${{ secrets.ARKA_KEY_ALIAS }}
      ARKA_KEY_PASSWORD: ${{ secrets.ARKA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests

      - name: Chave de envio (para o .aab da Play Store)
        id: key
        run: |
          if [ -n "$ARKA_KEYSTORE_B64" ] && [ -n "$ARKA_KEYSTORE_PASSWORD" ] && [ -n "$ARKA_KEY_ALIAS" ] && [ -n "$ARKA_KEY_PASSWORD" ]; then
            echo "$ARKA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/arka-upload.jks"
            echo "ARKA_KEYSTORE_PATH=$RUNNER_TEMP/arka-upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Segredos da chave não encontrados. O .aab abaixo NÃO serve para a Play Store. Rode o workflow 'Gerar Keystore' e cadastre os 4 segredos (veja PUBLICAR.md)."
          fi

      - name: Build APK debug, APK release e AAB release
        run: >
          gradle assembleDebug assembleRelease bundleRelease --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}

      - name: Collect files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Arka-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Arka-release.apk
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/bundle/release/app-release.aab dist/Arka-PLAYSTORE.aab
          else
            cp app/build/outputs/bundle/release/app-release.aab dist/Arka-SEM-CHAVE-nao-enviar.aab
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Arka-APK
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Arka-AAB
          path: dist/*.aab

      - name: Publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
